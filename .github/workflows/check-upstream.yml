name: Check upstream versions

on:
  workflow_dispatch:
  schedule:
    - cron: '21 9 * * 1'

permissions:
  contents: read
  actions: write

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

    steps:
      - name: Validate settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]]

      - name: Check latest upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          latest_release_or_tag() {
            local repo=$1
            local latest

            if latest=$(gh api "repos/$repo/releases/latest" --jq '.tag_name' 2>/dev/null); then
              printf '%s\n' "$latest"
              return
            fi

            gh api "repos/$repo/tags" --jq '.[0].name'
          }

          caddy_base_images_exist() {
            local version=$1

            docker manifest inspect "caddy:${version}-builder" >/dev/null 2>&1 \
              && docker manifest inspect "caddy:${version}-alpine" >/dev/null 2>&1
          }

          latest_buildable_caddy() {
            local tag
            local version

            while IFS= read -r tag; do
              version=${tag#v}

              if caddy_base_images_exist "$version"; then
                printf '%s\n' "$version"
                return
              fi

              echo "Skipping Caddy $version because Docker base images are not available yet." >&2
            done < <(
              gh api "repos/caddyserver/caddy/releases" --paginate \
                --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
            )

            echo "No buildable Caddy release found." >&2
            return 1
          }

          caddy=$(latest_buildable_caddy)
          porkbun=$(latest_release_or_tag caddy-dns/porkbun)
          docker_proxy=$(latest_release_or_tag lucaslorentz/caddy-docker-proxy)

          echo "caddy=$caddy" >> "$GITHUB_OUTPUT"
          echo "porkbun=$porkbun" >> "$GITHUB_OUTPUT"
          echo "docker_proxy=$docker_proxy" >> "$GITHUB_OUTPUT"

      - name: Inspect current candidate
        id: candidate
        shell: bash
        env:
          LATEST_CADDY: ${{ steps.versions.outputs.caddy }}
          LATEST_PORKBUN: ${{ steps.versions.outputs.porkbun }}
          LATEST_DOCKER_PROXY: ${{ steps.versions.outputs.docker_proxy }}
        run: |
          set -euo pipefail

          up_to_date=false

          if docker pull "$IMAGE:candidate" >/dev/null 2>&1; then
            docker create --name candidate-check "$IMAGE:candidate" >/dev/null

            docker cp \
              candidate-check:/usr/share/licenses/caddy-custom/build-info.txt \
              /tmp/build-info.txt

            docker rm candidate-check >/dev/null

            candidate_caddy=$(
              docker run --rm --network none "$IMAGE:candidate" version |
              sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
            )

            candidate_porkbun=$(
              awk '$1 == "dep" && $2 == "github.com/caddy-dns/porkbun" {print $3}' \
                /tmp/build-info.txt
            )

            candidate_docker_proxy=$(
              awk '$1 == "dep" && $2 == "github.com/lucaslorentz/caddy-docker-proxy/v2" {print $3}' \
                /tmp/build-info.txt
            )

            if [[ "$candidate_caddy" == "$LATEST_CADDY" \
               && "$candidate_porkbun" == "$LATEST_PORKBUN" \
               && "$candidate_docker_proxy" == "$LATEST_DOCKER_PROXY" ]]; then
              up_to_date=true
            fi
          fi

          echo "up_to_date=$up_to_date" >> "$GITHUB_OUTPUT"

      - name: Nothing to update
        if: steps.candidate.outputs.up_to_date == 'true'
        run: echo "Candidate already contains the newest upstream versions."

      - name: Report upstream update
        if: steps.candidate.outputs.up_to_date != 'true'
        shell: bash
        env:
          LATEST_CADDY: ${{ steps.versions.outputs.caddy }}
          LATEST_PORKBUN: ${{ steps.versions.outputs.porkbun }}
          LATEST_DOCKER_PROXY: ${{ steps.versions.outputs.docker_proxy }}
        run: |
          set -euo pipefail

          {
            echo "New upstream versions were detected and an automatic candidate/stable build was requested."
            echo
            echo "| Component | Latest |"
            echo "| --- | --- |"
            echo "| Caddy | \`$LATEST_CADDY\` |"
            echo "| caddy-dns/porkbun | \`$LATEST_PORKBUN\` |"
            echo "| caddy-docker-proxy | \`$LATEST_DOCKER_PROXY\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start newest image build
        if: steps.candidate.outputs.up_to_date != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run candidate.yml --ref "${{ github.ref_name }}"
