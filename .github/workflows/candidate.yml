name: Build candidate

on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: Optional Caddy version without v prefix. Leave blank for newest.
        required: false
        default: ''
      porkbun_version:
        description: Optional Porkbun version. Leave blank for newest.
        required: false
        default: ''
      docker_proxy_version:
        description: Optional docker-proxy version. Leave blank for newest.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-candidate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CADDY: ${{ inputs.caddy_version }}
          INPUT_PORKBUN: ${{ inputs.porkbun_version }}
          INPUT_DOCKER_PROXY: ${{ inputs.docker_proxy_version }}
        run: |
          set -euo pipefail

          latest_release_or_tag() {
            local repo=$1
            local latest

            if latest=$(gh api "repos/$repo/releases/latest" --jq '.tag_name' 2>/dev/null); then
              printf '%s\n' "$latest"
              return
            fi

            gh api "repos/$repo/tags" --jq '.[0].name'
          }

          if [[ -n "$INPUT_CADDY" ]]; then
            caddy="$INPUT_CADDY"
          else
            caddy=$(latest_release_or_tag caddyserver/caddy | sed 's/^v//')
          fi

          if [[ -n "$INPUT_PORKBUN" ]]; then
            porkbun="$INPUT_PORKBUN"
          else
            porkbun=$(latest_release_or_tag caddy-dns/porkbun)
          fi

          if [[ -n "$INPUT_DOCKER_PROXY" ]]; then
            docker_proxy="$INPUT_DOCKER_PROXY"
          else
            docker_proxy=$(latest_release_or_tag lucaslorentz/caddy-docker-proxy)
          fi

          [[ "$caddy" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$porkbun" =~ ^v[0-9][a-zA-Z0-9.+-]*$ ]]
          [[ "$docker_proxy" =~ ^v[0-9][a-zA-Z0-9.+-]*$ ]]

          echo "caddy=$caddy" >> "$GITHUB_OUTPUT"
          echo "porkbun=$porkbun" >> "$GITHUB_OUTPUT"
          echo "docker_proxy=$docker_proxy" >> "$GITHUB_OUTPUT"

      - name: Build and smoke test
        shell: bash
        env:
          CADDY_VERSION: ${{ steps.versions.outputs.caddy }}
          PORKBUN_VERSION: ${{ steps.versions.outputs.porkbun }}
          DOCKER_PROXY_VERSION: ${{ steps.versions.outputs.docker_proxy }}
        run: |
          set -euo pipefail

          docker build --pull \
            --build-arg "CADDY_VERSION=$CADDY_VERSION" \
            --build-arg "PORKBUN_VERSION=$PORKBUN_VERSION" \
            --build-arg "DOCKER_PROXY_VERSION=$DOCKER_PROXY_VERSION" \
            -t "$IMAGE:$BUILD_TAG" .

          actual=$(docker run --rm --network none "$IMAGE:$BUILD_TAG" version)
          [[ "$actual" == "v$CADDY_VERSION "* ]]

          docker run --rm --network none \
            "$IMAGE:$BUILD_TAG" list-modules > /tmp/modules.txt

          grep -Fx dns.providers.porkbun /tmp/modules.txt
          grep -Fx docker_proxy /tmp/modules.txt

          docker run --rm --network none \
            "$IMAGE:$BUILD_TAG" docker-proxy --help

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        shell: bash
        run: |
          set -euo pipefail

          docker push "$IMAGE:$BUILD_TAG"
          docker tag "$IMAGE:$BUILD_TAG" "$IMAGE:candidate"
          docker push "$IMAGE:candidate"
          docker tag "$IMAGE:$BUILD_TAG" "$IMAGE:stable"
          docker push "$IMAGE:stable"

          echo "Exact test tag: $IMAGE:$BUILD_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Updated tags: candidate, stable" >> "$GITHUB_STEP_SUMMARY"

      - name: Update README Caddy version
        shell: bash
        env:
          CADDY_VERSION: ${{ steps.versions.outputs.caddy }}
        run: |
          set -euo pipefail

          sed -i -E "s/^- Caddy \`[0-9]+\.[0-9]+\.[0-9]+\`$/- Caddy \`$CADDY_VERSION\`/" README.md

          if git diff --quiet -- README.md; then
            echo "README already lists Caddy $CADDY_VERSION."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update Caddy version to $CADDY_VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
